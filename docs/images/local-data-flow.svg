<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title"><title id="title">本地数据流程 / Local data flow</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#758baa"/></marker></defs><rect width="1200" height="440" rx="24" fill="#f1f5f9"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#172b4d"><text x="48" y="57" font-size="28" font-weight="700">你的笔记，保存在本地 / Your notes stay local</text><text x="48" y="92" font-size="18" fill="#52647c">ChatGPT NET 扩展数据流程 / Extension data flow</text><g fill="white"><rect x="48" y="147" width="286" height="143" rx="16"/><rect x="457" y="147" width="286" height="143" rx="16"/><rect x="866" y="147" width="286" height="143" rx="16"/></g><path d="M340 219H445" stroke="#758baa" stroke-width="3" marker-end="url(#arrow)"/><path d="M755 219H854" stroke="#758baa" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="191" y="190" text-anchor="middle" font-size="21">ChatGPT 页面</text><text x="191" y="224" text-anchor="middle" font-size="18">ChatGPT page DOM</text><text x="191" y="261" text-anchor="middle" font-size="16">选取内容 / Select excerpts</text><text x="600" y="190" text-anchor="middle" font-size="21">Firefox 本地存储</text><text x="600" y="224" text-anchor="middle" font-size="18">Local extension storage</text><text x="600" y="261" text-anchor="middle" font-size="16">画布与备忘 / Canvas and memos</text><text x="1009" y="190" text-anchor="middle" font-size="21">用户备份文件</text><text x="1009" y="224" text-anchor="middle" font-size="18">User backup files</text><text x="1009" y="261" text-anchor="middle" font-size="16">手动导出与导入 / Export and import</text><text x="48" y="337" font-size="19">扩展不调用私有 ChatGPT API，不拦截网络请求，也不会自动发送消息。</text><text x="48" y="370" font-size="17" fill="#52647c">No private API calls, request interception, or automatic message sending by the extension.</text><text x="48" y="410" font-size="14" fill="#64748b">仅描述扩展行为；ChatGPT 网站有自己的网络行为。 / Diagram describes the extension, not the website's own traffic.</text></g></svg>
