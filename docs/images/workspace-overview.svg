<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title"><title id="title">ChatGPT NET 工作区示意 / Workspace overview</title><rect width="1200" height="620" rx="24" fill="#f1f5f9"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#172b4d"><text x="48" y="58" font-size="28" font-weight="700">ChatGPT NET · 从对话到知识结构</text><text x="48" y="92" font-size="19" fill="#52647c">From conversation excerpts to a visual knowledge workspace</text><rect x="40" y="125" width="360" height="420" rx="18" fill="white"/><text x="65" y="169" font-size="21">对话摘录 / Excerpts</text><rect x="65" y="198" width="310" height="120" rx="12" fill="#e8eff8"/><text x="85" y="239" font-size="18">选取对话中的关键片段</text><text x="85" y="274" font-size="16">Keep the ideas that matter</text><text x="65" y="388" font-size="18">保留原文锚点，方便回看</text><text x="65" y="421" font-size="16">Return to the source in context</text><rect x="424" y="125" width="736" height="275" rx="18" fill="white"/><text x="450" y="169" font-size="21">层级画布 / Hierarchy canvas</text><path d="M792 250V271M610 271H975M610 271V290M975 271V290" fill="none" stroke="#8093ae" stroke-width="3"/><rect x="677" y="195" width="230" height="55" rx="10" fill="#d9e4f3"/><text x="792" y="230" text-anchor="middle" font-size="19">主题 / Topic</text><rect x="465" y="290" width="290" height="65" rx="10" fill="#dce8ce"/><text x="610" y="330" text-anchor="middle" font-size="19">关键观点 / Key idea</text><rect x="830" y="290" width="290" height="65" rx="10" fill="#f2e7c8"/><text x="975" y="330" text-anchor="middle" font-size="19">补充思考 / Reflection</text><rect x="424" y="420" width="736" height="125" rx="18" fill="white"/><text x="450" y="462" font-size="21">备忘区 / Memo workspace</text><text x="450" y="508" font-size="18">暂存灵感，稍后整理 / Capture now, organize later</text><text x="48" y="586" font-size="15" fill="#64748b">功能示意图，非界面截图 / Conceptual illustration, not a product screenshot</text></g></svg>
